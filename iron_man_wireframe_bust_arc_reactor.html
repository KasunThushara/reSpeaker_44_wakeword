<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. // Mark VII Holographic Chassis & Arc Reactor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-obsidian: #07090d;
            --cyan-primary: #00d8ff;
            --cyan-glow: rgba(0, 216, 255, 0.65);
            --cyan-dim: rgba(0, 216, 255, 0.16);
            --crimson-accent: #ff3344;
            --crimson-glow: rgba(255, 51, 68, 0.65);
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-obsidian);
            color: var(--cyan-primary);
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Subtle blueprint grid background matching the Rainmeter aesthetic */
        .blueprint-bg {
            position: fixed;
            inset: 0;
            background-image: 
                radial-gradient(circle at 50% 48%, rgba(0, 216, 255, 0.08) 0%, rgba(7, 9, 13, 0.96) 72%),
                linear-gradient(to right, rgba(0, 216, 255, 0.035) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 216, 255, 0.035) 1px, transparent 1px),
                linear-gradient(to right, rgba(0, 216, 255, 0.015) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 216, 255, 0.015) 1px, transparent 1px);
            background-size: 100% 100%, 80px 80px, 80px 80px, 16px 16px, 16px 16px;
            z-index: 0;
        }

        /* Holographic CRT / Laser Scanline Overlay */
        .scanline-overlay {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 2px,
                rgba(0, 216, 255, 0.03) 3px,
                rgba(0, 0, 0, 0.25) 4px
            );
            pointer-events: none;
            z-index: 20;
            transition: opacity 0.4s ease;
        }

        .scan-beam {
            position: fixed;
            left: 0;
            right: 0;
            height: 120px;
            background: linear-gradient(
                to bottom,
                transparent,
                rgba(0, 216, 255, 0.05) 50%,
                rgba(0, 216, 255, 0.14) 98%,
                rgba(0, 216, 255, 0.4) 100%
            );
            pointer-events: none;
            z-index: 15;
            animation: verticalScan 7s linear infinite;
            transition: opacity 0.4s ease;
        }

        @keyframes verticalScan {
            0% { transform: translateY(-150px); }
            100% { transform: translateY(105vh); }
        }

        /* Main Stage Container */
        .hologram-stage {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            perspective: 1200px;
        }

        .robot-assembly {
            position: relative;
            width: min(94vw, 860px);
            height: min(88vh, 840px);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease-out, filter 0.35s ease;
            will-change: transform;
        }

        /* SVG & Canvas Layering */
        svg.suit-wireframe {
            width: 100%;
            height: 100%;
            overflow: visible;
            filter: drop-shadow(0 0 8px rgba(0, 216, 255, 0.25));
            transition: filter 0.4s ease;
        }

        canvas#reactorCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* SVG Wireframe Stroke Classes */
        .armor-outer {
            fill: rgba(0, 216, 255, 0.025);
            stroke: #00d8ff;
            stroke-width: 1.75;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .armor-panel {
            fill: rgba(4, 18, 28, 0.45);
            stroke: #00d8ff;
            stroke-width: 1.3;
            stroke-linejoin: round;
            transition: fill 0.3s ease, stroke 0.3s ease;
        }

        .armor-detail {
            fill: none;
            stroke: rgba(0, 216, 255, 0.52);
            stroke-width: 0.85;
            stroke-linecap: round;
        }

        .armor-micro-grid {
            fill: none;
            stroke: rgba(0, 216, 255, 0.18);
            stroke-width: 0.55;
        }

        .crimson-circuit {
            fill: rgba(255, 51, 68, 0.08);
            stroke: #ff3344;
            stroke-width: 1.35;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 5px rgba(255, 51, 68, 0.7));
            transition: stroke 0.3s ease, filter 0.3s ease;
        }

        .crimson-node {
            fill: #ff3344;
            filter: drop-shadow(0 0 6px #ff3344);
        }

        /* Glowing Eyes Animation */
        .eye-visor {
            fill: #aef6ff;
            stroke: #ffffff;
            stroke-width: 1.1;
            filter: drop-shadow(0 0 8px #00d8ff) drop-shadow(0 0 18px #00d8ff);
            transition: all 0.3s ease;
        }

        .eye-socket {
            fill: rgba(0, 12, 22, 0.9);
            stroke: #00d8ff;
            stroke-width: 1.5;
        }

        /* Diagnostic Overdrive State */
        body.diagnostic-boost .robot-assembly {
            filter: drop-shadow(0 0 16px rgba(0, 216, 255, 0.55));
        }
        body.diagnostic-boost .armor-panel {
            fill: rgba(0, 216, 255, 0.09);
        }
        body.diagnostic-boost .crimson-circuit {
            stroke: #ff4d5e;
            stroke-width: 1.8;
            filter: drop-shadow(0 0 10px #ff3344);
        }
        body.diagnostic-boost .eye-visor {
            fill: #ffffff;
            filter: drop-shadow(0 0 12px #00d8ff) drop-shadow(0 0 28px #00d8ff);
        }

        /* Minimalist HUD Control Bar */
        .hud-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            padding: 8px 14px;
            background: rgba(7, 13, 21, 0.78);
            border: 1px solid rgba(0, 216, 255, 0.32);
            border-radius: 12px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8), inset 0 0 12px rgba(0, 216, 255, 0.08);
        }

        .hud-btn {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid rgba(0, 216, 255, 0.4);
            background: rgba(0, 216, 255, 0.07);
            color: #9beeff;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .hud-btn:hover {
            background: rgba(0, 216, 255, 0.2);
            border-color: #00d8ff;
            color: #ffffff;
            box-shadow: 0 0 14px rgba(0, 216, 255, 0.45);
        }

        .hud-btn.active {
            background: rgba(0, 216, 255, 0.26);
            border-color: #00d8ff;
            color: #ffffff;
            box-shadow: 0 0 14px rgba(0, 216, 255, 0.5);
        }

        .hud-btn.surge-btn {
            border-color: rgba(255, 51, 68, 0.55);
            background: rgba(255, 51, 68, 0.12);
            color: #ff9aa3;
        }

        .hud-btn.surge-btn:hover,
        .hud-btn.surge-btn.surging {
            background: rgba(255, 51, 68, 0.3);
            border-color: #ff3344;
            color: #ffffff;
            box-shadow: 0 0 18px rgba(255, 51, 68, 0.65);
        }

        .indicator-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #00d8ff;
            box-shadow: 0 0 6px #00d8ff;
        }

        .surge-btn .indicator-dot {
            background: #ff3344;
            box-shadow: 0 0 6px #ff3344;
        }

        /* Subtle Top Technical Tag */
        .chassis-tag {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            letter-spacing: 0.24em;
            color: rgba(0, 216, 255, 0.6);
            text-transform: uppercase;
            z-index: 25;
            pointer-events: none;
            white-space: nowrap;
        }
    </style>
</head>

    <script>
        /**
         * J.A.R.V.I.S. Holographic Arc Reactor & Chassis Controller
         * Renders the multi-ring rotating Mark VII Arc Reactor directly onto the chest cavity
         * of the vector wireframe, complete with turbine coils, radial ticks, crimson telemetry arcs,
         * and interactive power surge dynamics.
         */
        (function () {
            const canvas = document.getElementById('reactorCanvas');
            const ctx = canvas.getContext('2d');
            const assembly = document.getElementById('robotAssembly');
            const surgeBtn = document.getElementById('surgeBtn');
            const diagBtn = document.getElementById('diagBtn');
            const scanBtn = document.getElementById('scanBtn');
            const scanBeam = document.getElementById('scanBeam');
            const scanlineOverlay = document.getElementById('scanlineOverlay');

            // Interactive state
            let state = {
                time: 0,
                surgeIntensity: 0,      // 0.0 (idle) -> 1.0 (full power surge)
                targetSurge: 0,
                diagnosticBoost: false,
                scanlinesEnabled: true,
                mouseX: 0,
                mouseY: 0,
                currentTiltX: 0,
                currentTiltY: 0
            };

            // Resize canvas to match high-DPI display and container dimensions
            function resizeCanvas() {
                const rect = assembly.getBoundingClientRect();
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // Subtle 3D Parallax on Mouse / Touch Move
            function handlePointerMove(clientX, clientY) {
                const nx = (clientX / window.innerWidth) * 2 - 1;  // -1 to 1
                const ny = (clientY / window.innerHeight) * 2 - 1; // -1 to 1
                state.mouseX = nx;
                state.mouseY = ny;
            }

            window.addEventListener('mousemove', (e) => handlePointerMove(e.clientX, e.clientY));
            window.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) {
                    handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: true });

            // Trigger Reactor Power Surge
            function triggerSurge() {
                state.targetSurge = 1.0;
                surgeBtn.classList.add('surging');
                setTimeout(() => {
                    state.targetSurge = 0.0;
                    surgeBtn.classList.remove('surging');
                }, 1800);
            }

            surgeBtn.addEventListener('click', triggerSurge);

            // Clicking directly on the Arc Reactor center also triggers a surge
            document.getElementById('hologramStage').addEventListener('click', (e) => {
                if (e.target.closest('.hud-controls')) return;
                triggerSurge();
            });

            // Toggle Diagnostic High-Glow Mode
            diagBtn.addEventListener('click', () => {
                state.diagnosticBoost = !state.diagnosticBoost;
                document.body.classList.toggle('diagnostic-boost', state.diagnosticBoost);
                diagBtn.classList.toggle('active', state.diagnosticBoost);
            });

            // Toggle Hologram Scanlines
            scanBtn.addEventListener('click', () => {
                state.scanlinesEnabled = !state.scanlinesEnabled;
                scanBtn.classList.toggle('active', state.scanlinesEnabled);
                const opacity = state.scanlinesEnabled ? '1' : '0';
                scanBeam.style.opacity = opacity;
                scanlineOverlay.style.opacity = opacity;
            });

            /**
             * Draws a segmented radial tick ring
             */
            function drawTickRing(cx, cy, radius, count, tickLen, lineWidth, color, rotation, skipMod = 0) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(rotation);
                ctx.strokeStyle = color;
                ctx.lineWidth = lineWidth;

                const step = (Math.PI * 2) / count;
                for (let i = 0; i < count; i++) {
                    if (skipMod > 0 && i % skipMod === 0) continue;
                    const angle = i * step;
                    const x1 = Math.cos(angle) * (radius - tickLen * 0.5);
                    const y1 = Math.sin(angle) * (radius - tickLen * 0.5);
                    const x2 = Math.cos(angle) * (radius + tickLen * 0.5);
                    const y2 = Math.sin(angle) * (radius + tickLen * 0.5);

                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                }
                ctx.restore();
            }

            /**
             * Draws segmented technical arc brackets around the reactor
             */
            function drawSegmentedArcs(cx, cy, radius, segments, lineWidth, color, rotation) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(rotation);
                ctx.strokeStyle = color;
                ctx.lineWidth = lineWidth;

                segments.forEach(([startDeg, endDeg]) => {
                    ctx.beginPath();
                    ctx.arc(0, 0, radius, (startDeg * Math.PI) / 180, (endDeg * Math.PI) / 180);
                    ctx.stroke();
                });
                ctx.restore();
            }

            /**
             * Main Animation Loop
             */
            function animate(timestamp) {
                const dt = 0.016;
                state.time += dt;

                // Smoothly interpolate surge intensity
                state.surgeIntensity += (state.targetSurge - state.surgeIntensity) * 0.08;

                // Smoothly interpolate subtle 3D parallax tilt
                state.currentTiltX += (state.mouseX * 5 - state.currentTiltX) * 0.08;
                state.currentTiltY += (-state.mouseY * 4 - state.currentTiltY) * 0.08;
                assembly.style.transform = `rotateY(${state.currentTiltX.toFixed(2)}deg) rotateX(${state.currentTiltY.toFixed(2)}deg)`;

                const width = assembly.clientWidth;
                const height = assembly.clientHeight;
                ctx.clearRect(0, 0, width, height);

                // Map SVG viewBox coordinate (400, 526) into rendered container space
                // SVG viewBox is 800x800 with preserveAspectRatio="xMidYMid meet"
                const scale = Math.min(width / 800, height / 800);
                const offsetX = (width - 800 * scale) / 2;
                const offsetY = (height - 800 * scale) / 2;

                // Exact chest center matching the Rainmeter Iron Man Arc Reactor placement
                const cx = offsetX + 400 * scale;
                const cy = offsetY + 526 * scale;
                const baseR = 132 * scale; // Outer perimeter radius of the HUD reactor

                const speedMult = 1 + state.surgeIntensity * 3.8;
                const pulse = Math.sin(state.time * 4) * 0.04 + state.surgeIntensity * 0.14;

                // -----------------------------------------------------------
                // LAYER 1: Outer HUD Housing & Crimson Sector Arc
                // (Matches the distinct red left-arc & grey/cyan rings in image)
                // -----------------------------------------------------------
                ctx.save();
                // Dark core housing backdrop so chest lines cleanly recess behind reactor
                const housingGrad = ctx.createRadialGradient(cx, cy, baseR * 0.1, cx, cy, baseR * 1.12);
                housingGrad.addColorStop(0, 'rgba(4, 14, 24, 0.95)');
                housingGrad.addColorStop(0.75, 'rgba(6, 12, 20, 0.85)');
                housingGrad.addColorStop(1, 'rgba(6, 12, 20, 0)');
                ctx.fillStyle = housingGrad;
                ctx.beginPath();
                ctx.arc(cx, cy, baseR * 1.12, 0, Math.PI * 2);
                ctx.fill();

                // Crimson Power Gauge Arc on the Left (Signature detail from wallpaper)
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(Math.sin(state.time * 0.7) * 0.05);
                ctx.strokeStyle = `rgba(255, 51, 68, ${0.72 + state.surgeIntensity * 0.28})`;
                ctx.lineWidth = 11 * scale;
                ctx.shadowColor = '#ff3344';
                ctx.shadowBlur = (10 + state.surgeIntensity * 16) * scale;
                ctx.beginPath();
                ctx.arc(0, 0, baseR * 0.86, (148 * Math.PI) / 180, (226 * Math.PI) / 180);
                ctx.stroke();
                ctx.restore();

                // Outer Metallic-Cyan Concentric Rings
                drawSegmentedArcs(
                    cx, cy, baseR * 1.02,
                    [[15, 78], [96, 165], [195, 262], [282, 348]],
                    2.2 * scale,
                    'rgba(0, 216, 255, 0.55)',
                    state.time * 0.18 * speedMult
                );

                drawSegmentedArcs(
                    cx, cy, baseR * 0.94,
                    [[0, 120], [140, 245], [265, 340]],
                    1.2 * scale,
                    'rgba(160, 235, 255, 0.35)',
                    -state.time * 0.25 * speedMult
                );

                // -----------------------------------------------------------
                // LAYER 2: High-Density Radial Telemetry Ticks
                // -----------------------------------------------------------
                drawTickRing(
                    cx, cy,
                    baseR * 0.76,
                    72,
                    9 * scale,
                    1.2 * scale,
                    'rgba(0, 216, 255, 0.5)',
                    state.time * 0.12 * speedMult,
                    6
                );

                drawTickRing(
                    cx, cy,
                    baseR * 0.64,
                    48,
                    6 * scale,
                    1.5 * scale,
                    'rgba(220, 248, 255, 0.65)',
                    -state.time * 0.32 * speedMult,
                    0
                );

                // -----------------------------------------------------------
                // LAYER 3: 10 Electromagnetic Palladium/New-Element Coils
                // -----------------------------------------------------------
                const coilCount = 10;
                const coilRadius = baseR * 0.48;
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(state.time * 0.42 * speedMult);

                for (let i = 0; i < coilCount; i++) {
                    const angle = (i * Math.PI * 2) / coilCount;
                    ctx.save();
                    ctx.rotate(angle);

                    // Coil housing wedge
                    ctx.fillStyle = `rgba(0, 216, 255, ${0.18 + state.surgeIntensity * 0.25})`;
                    ctx.strokeStyle = '#00d8ff';
                    ctx.lineWidth = 1.3 * scale;

                    const w = 11 * scale;
                    const h = 15 * scale;
                    ctx.beginPath();
                    ctx.roundRect(-w / 2, -coilRadius - h / 2, w, h, 2 * scale);
                    ctx.fill();
                    ctx.stroke();

                    // Inner glowing coil filament
                    ctx.fillStyle = '#bff6ff';
                    ctx.fillRect(-w * 0.25, -coilRadius - h * 0.25, w * 0.5, h * 0.5);

                    ctx.restore();
                }
                ctx.restore();

                // -----------------------------------------------------------
                // LAYER 4: Inner Turbine Blades & Triangular Core Aperture
                // -----------------------------------------------------------
                drawSegmentedArcs(
                    cx, cy, baseR * 0.34,
                    [[10, 105], [130, 225], [250, 345]],
                    2.6 * scale,
                    '#7ceeff',
                    -state.time * 0.85 * speedMult
                );

                // Glowing Plasma Core Aura
                const coreRadius = baseR * (0.28 + pulse * 0.25);
                const coreGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreRadius * 2.2);
                coreGlow.addColorStop(0, 'rgba(255, 255, 255, 0.98)');
                coreGlow.addColorStop(0.25, `rgba(110, 238, 255, ${0.85 + state.surgeIntensity * 0.15})`);
                coreGlow.addColorStop(0.55, `rgba(0, 216, 255, ${0.38 + state.surgeIntensity * 0.35})`);
                coreGlow.addColorStop(1, 'rgba(0, 216, 255, 0)');

                ctx.fillStyle = coreGlow;
                ctx.beginPath();
                ctx.arc(cx, cy, coreRadius * 2.2, 0, Math.PI * 2);
                ctx.fill();

                // Inner Ring & Bright White-Cyan Center Nucleus
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.8 * scale;
                ctx.beginPath();
                ctx.arc(cx, cy, baseR * 0.20, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = '#00d8ff';
                ctx.shadowBlur = (18 + state.surgeIntensity * 25) * scale;
                ctx.beginPath();
                ctx.arc(cx, cy, baseR * (0.12 + pulse * 0.12), 0, Math.PI * 2);
                ctx.fill();

                // Subtle Crosshair Reticle Lines across Reactor Center
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(0, 216, 255, 0.35)';
                ctx.lineWidth = 0.9 * scale;
                const crossInner = baseR * 0.23;
                const crossOuter = baseR * 1.08;
                ctx.beginPath();
                ctx.moveTo(cx - crossOuter, cy);
                ctx.lineTo(cx - crossInner, cy);
                ctx.moveTo(cx + crossInner, cy);
                ctx.lineTo(cx + crossOuter, cy);
                ctx.moveTo(cx, cy - crossOuter);
                ctx.lineTo(cx, cy - crossInner);
                ctx.moveTo(cx, cy + crossInner);
                ctx.lineTo(cx, cy + crossOuter);
                ctx.stroke();

                ctx.restore();

                requestAnimationFrame(animate);
            }

            // Start rendering loop
            window.onload = function () {
                resizeCanvas();
                requestAnimationFrame(animate);
            };
        })();
    </script>
</body>
</html>
