<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS — command center</title>
<style>
  :root{
    --hue: 185;
    --c:  hsl(var(--hue) 100% 62%);
    --c2: hsl(calc(var(--hue) + 28) 100% 55%);
    --c3: hsl(calc(var(--hue) - 18) 100% 70%);
    --dim: hsl(var(--hue) 60% 40%);
    --bg: #04070b;
    --bass: 0;
    --mid: 0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 700px at 50% 30%, hsl(var(--hue) 80% 12% / .55), transparent 65%),
      radial-gradient(900px 500px at 80% 90%, hsl(var(--hue) 90% 10% / .45), transparent 70%),
      var(--bg);
    color: var(--c);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow:hidden;
    letter-spacing:.02em;
  }
  /* ---------- scanline / grid atmosphere ---------- */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:5;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.028) 0 1px, transparent 1px 3px);
    mix-blend-mode: overlay; opacity:.5;
  }
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:4;
    background:
      linear-gradient(transparent 0 49.5%, hsl(var(--hue) 100% 60% / .05) 49.5% 50.5%, transparent 50.5%),
      repeating-linear-gradient(90deg, hsl(var(--hue) 100% 60% / .035) 0 1px, transparent 1px 64px);
    background-size: 100% 100%, 64px 100%;
  }

  /* ---------- boot ---------- */
  #boot{
    position:fixed; inset:0; z-index:50; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:26px;
    background: radial-gradient(circle at 50% 45%, hsl(var(--hue) 90% 10%), #010305 70%);
    transition: opacity .7s ease, visibility .7s;
  }
  #boot.gone{opacity:0; visibility:hidden}
  .boot-title{
    font-size: clamp(42px, 8vw, 92px); letter-spacing:.42em; font-weight:200;
    text-shadow: 0 0 24px var(--c), 0 0 70px hsl(var(--hue) 100% 50% / .5);
    animation: flicker 3.5s infinite;
  }
  .boot-sub{font-family: Consolas, "Cascadia Mono", monospace; font-size:13px; letter-spacing:.34em; color: var(--dim)}
  .boot-bar{width:min(420px,70vw); height:2px; background: hsl(var(--hue) 60% 20%); overflow:hidden}
  .boot-bar i{display:block; height:100%; width:0; background: var(--c); box-shadow:0 0 12px var(--c); animation: load 1.6s ease forwards}
  .boot-btn{
    margin-top:10px; padding:12px 34px; background:transparent; color:var(--c);
    border:1px solid var(--c); letter-spacing:.34em; font-size:13px; cursor:pointer;
    box-shadow: 0 0 18px hsl(var(--hue) 100% 50% / .35), inset 0 0 18px hsl(var(--hue) 100% 50% / .12);
    transition: .25s;
  }
  .boot-btn:hover{background: hsl(var(--hue) 100% 60% / .14); box-shadow:0 0 34px var(--c)}
  @keyframes load{to{width:100%}}
  @keyframes flicker{
    0%,92%,100%{opacity:1} 93%{opacity:.55} 94%{opacity:1} 96%{opacity:.7} 97%{opacity:1}
  }

  /* ---------- layout ---------- */
  #app{
    position:relative; z-index:10; height:100%;
    display:grid;
    grid-template-columns: minmax(210px, 17vw) 1fr minmax(240px, 20vw);
    grid-template-rows: 62px 1fr 104px;
    grid-template-areas: "head head head" "cmds stage log" "spec spec spec";
    gap: 10px; padding: 10px 14px 6px;
  }

  /* head */
  header{grid-area:head; position:relative; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid hsl(var(--hue) 70% 40% / .35)}
  .wordmark{font-size:22px; letter-spacing:.55em; font-weight:200; text-shadow:0 0 16px var(--c)}
  .wordmark b{font-weight:600}
  .hud-right{display:flex; gap:22px; align-items:center; font-family:Consolas,monospace; font-size:12px; letter-spacing:.14em; color:var(--dim)}
  .dot{width:8px;height:8px;border-radius:50%;background:#555;display:inline-block;margin-right:7px;transition:.3s}
  .dot.on{background:var(--c); box-shadow:0 0 10px var(--c)}

  /* commands */
  #cmds{grid-area:cmds; display:flex; flex-direction:column; gap:6px; overflow:hidden}
  .cmd{
    display:flex; align-items:center; gap:10px; padding:7px 10px; cursor:pointer;
    background: hsl(var(--hue) 100% 50% / .04);
    border:1px solid hsl(var(--hue) 70% 45% / .28);
    font-size:12px; letter-spacing:.06em; color: hsl(var(--hue) 90% 78%);
    transition: background .18s, border-color .18s, transform .1s;
  }
  .cmd:hover{background: hsl(var(--hue) 100% 60% / .14); border-color:var(--c); box-shadow:0 0 16px hsl(var(--hue) 100% 55% / .25)}
  .cmd:active{transform:scale(.985)}
  .cmd.active{background: hsl(var(--hue) 100% 60% / .22); border-color:var(--c); box-shadow:0 0 22px hsl(var(--hue) 100% 55% / .45)}
  .cmd kbd{
    min-width:20px; text-align:center; font-family:Consolas,monospace; font-size:11px;
    border:1px solid hsl(var(--hue) 70% 45% / .5); padding:1px 4px; color:var(--c3)
  }

  /* stage */
  #stage{grid-area:stage; position:relative; display:flex; align-items:center; justify-content:center; min-height:0}
  #stage::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(closest-side at 50% 45%, hsl(var(--hue) 100% 60% / .10), transparent 72%);
  }
  .robot-wrap{position:relative; height:100%; aspect-ratio: 420/500; max-height:100%; z-index:1}
  svg.robot{width:100%; height:100%; overflow:visible}
  .ring-rot{transform-box: fill-box; transform-origin: center}
  .r1{animation: spin 42s linear infinite}
  .r2{animation: spin 28s linear infinite reverse}
  .r3{animation: spin 16s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .reactor-core{transform-box: fill-box; transform-origin: center; transform: scale(calc(1 + var(--bass) * .18)); filter:url(#glowBig)}
  .eye-glow{opacity: calc(.72 + var(--mid) * .28)}

  /* status (kept in the header so it never overlaps the robot) */
  .status{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    text-align:center; white-space:nowrap; pointer-events:none;
  }
  .status .state{font-size:12px; letter-spacing:.42em; color:var(--c3); text-shadow:0 0 14px var(--c)}
  .status .heard{
    font-family:Consolas,monospace; font-size:13px; letter-spacing:.06em; color:#eafcff;
    text-shadow:0 0 18px var(--c); min-height:16px; margin-top:1px;
  }

  /* log */
  #log{grid-area:log; display:flex; flex-direction:column; min-height:0; border-left:1px solid hsl(var(--hue) 70% 40% / .3); padding-left:10px}
  .log-title{font-family:Consolas,monospace; font-size:11px; letter-spacing:.28em; color:var(--dim); margin-bottom:6px}
  #loglist{flex:1; overflow:hidden; display:flex; flex-direction:column-reverse; gap:4px; font-family:Consolas,monospace; font-size:11.5px; line-height:1.35}
  .le{display:flex; gap:8px; opacity:.9}
  .le .t{color:hsl(var(--hue) 40% 45%)}
  .le.cmd{color:#eafcff}
  .le.ok{color:hsl(var(--hue) 100% 72%)}
  .le.warn{color:#ffcc66}
  .le.error{color:#ff6b6b}
  .le.net{color:hsl(var(--hue) 50% 60%)}

  /* spectrum */
  #spec{grid-area:spec; border-top:1px solid hsl(var(--hue) 70% 40% / .3); padding-top:6px}
  canvas{width:100%; height:82px; display:block}

  body.playing .wordmark{animation: breathe 2.4s ease-in-out infinite}
  @keyframes breathe{50%{text-shadow:0 0 30px var(--c), 0 0 90px hsl(var(--hue) 100% 50% / .55)}}
</style>
</head>
<body>

<div id="boot">
  <div class="boot-title">JARVIS</div>
  <div class="boot-bar"><i></i></div>
  <div class="boot-sub">INITIALISING NEURAL CORE — AUDIO SUBSYSTEM — NETWORK LINK</div>
  <button class="boot-btn" id="engage">ENGAGE</button>
</div>

<main id="app">
  <header>
    <div class="wordmark"><b>J</b>A<b>R</b>V<b>I</b>S</div>
    <div class="status">
      <div class="state" id="status">STANDBY</div>
      <div class="heard" id="heard">&nbsp;</div>
    </div>
    <div class="hud-right">
      <span><span class="dot" id="link"></span><span id="linktext">LINK</span></span>
      <span id="pcip">192.168.1.---</span>
      <span id="clock">--:--:--</span>
    </div>
  </header>

  <nav id="cmds"></nav>

  <section id="stage">
    <div class="robot-wrap">
      <svg class="robot" viewBox="0 0 420 500" aria-label="robot">
        <defs>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2.4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="glowBig" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="7" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <radialGradient id="core">
            <stop offset="0%"  stop-color="#ffffff"/>
            <stop offset="45%" stop-color="hsl(var(--hue) 100% 75%)"/>
            <stop offset="100%" stop-color="hsl(var(--hue) 100% 45%)" stop-opacity="0"/>
          </radialGradient>
          <clipPath id="faces"><path d="M210,92 L262,112 L276,170 L268,240 L238,298 L210,316 L182,298 L152,240 L144,170 L158,112 Z"/></clipPath>
        </defs>

        <!-- outer HUD rings -->
        <g opacity=".38" fill="none" stroke="var(--c)" stroke-width="1">
          <circle class="ring-rot r1" cx="210" cy="205" r="176" stroke-dasharray="2 12" opacity=".5"/>
          <circle class="ring-rot r2" cx="210" cy="205" r="158" stroke-dasharray="40 14 8 14" opacity=".7"/>
          <circle class="ring-rot r3" cx="210" cy="205" r="188" stroke-dasharray="120 260" stroke-width="2" opacity=".9"/>
        </g>

        <!-- helmet -->
        <g fill="none" stroke="var(--c)" stroke-linejoin="round">
          <path d="M210,44 L286,70 L316,132 L310,224 L282,300 L242,352 L210,366 L178,352 L138,300 L110,224 L104,132 L134,70 Z"
                stroke-width="2.2" filter="url(#glow)" opacity="1"/>
          <path d="M210,92 L262,112 L276,170 L268,240 L238,298 L210,316 L182,298 L152,240 L144,170 L158,112 Z"
                fill="hsl(var(--hue) 100% 50% / .06)" stroke-width="1.2" opacity=".85"/>
          <!-- crown seam + temple lines -->
          <path d="M210,44 L210,92" stroke-width=".9" opacity=".55"/>
          <path d="M158,112 L134,70 M262,112 L286,70" stroke-width=".8" opacity=".45"/>
          <path d="M144,170 L158,112 M276,170 L262,112" stroke-width=".8" opacity=".45"/>
          <path d="M138,300 L152,240 M282,300 L268,240" stroke-width=".8" opacity=".35"/>
          <!-- brow -->
          <path d="M150,162 L210,146 L270,162" stroke-width="1" opacity=".7"/>
          <!-- cheek vents -->
          <path d="M156,232 L188,248 M264,232 L232,248" stroke-width=".9" opacity=".55"/>
          <!-- jaw vents -->
          <g opacity=".75" stroke-width="2">
            <path d="M190,272 L230,272"/><path d="M192,282 L228,282"/><path d="M194,292 L226,292"/>
          </g>
        </g>

        <!-- eyes -->
        <g class="eye-glow" filter="url(#glowBig)">
          <path d="M168,184 L202,174 L205,206 L172,214 Z" fill="hsl(var(--hue) 100% 78%)" opacity=".92"/>
          <path d="M252,184 L218,174 L215,206 L248,214 Z" fill="hsl(var(--hue) 100% 78%)" opacity=".92"/>
        </g>
        <g fill="none" stroke="hsl(var(--hue) 100% 90%)" stroke-width="1" opacity=".85">
          <path d="M168,184 L202,174 L205,206 L172,214 Z"/>
          <path d="M252,184 L218,174 L215,206 L248,214 Z"/>
        </g>

        <!-- scan line inside the face -->
        <g clip-path="url(#faces)">
          <rect id="scan" x="140" y="90" width="140" height="10" fill="hsl(var(--hue) 100% 70% / .18)"/>
        </g>

        <!-- neck -->
        <g fill="none" stroke="var(--c)" stroke-width="1.1" opacity=".6">
          <path d="M186,366 L186,392 L234,392 L234,366"/>
          <path d="M192,370 L192,390 M228,370 L228,390"/>
        </g>

        <!-- chest -->
        <g fill="none" stroke="var(--c)" opacity=".8">
          <path d="M186,392 L96,420 L64,500 L196,500 L196,432" stroke-width="1.4"/>
          <path d="M234,392 L324,420 L356,500 L224,500 L224,432" stroke-width="1.4"/>
          <path d="M120,438 L196,452 M300,438 L224,452" stroke-width=".9" opacity=".6"/>
          <path d="M138,462 L196,470 M282,462 L224,470" stroke-width=".8" opacity=".45"/>
        </g>

        <!-- arc reactor -->
        <g>
          <circle class="ring-rot r2" cx="210" cy="462" r="46" fill="none" stroke="var(--c)" stroke-width="1" stroke-dasharray="14 10" opacity=".55"/>
          <circle class="ring-rot r1" cx="210" cy="462" r="58" fill="none" stroke="var(--c)" stroke-width=".8" stroke-dasharray="3 9" opacity=".4"/>
          <circle class="reactor-core" cx="210" cy="462" r="26" fill="url(#core)"/>
          <circle cx="210" cy="462" r="21" fill="none" stroke="hsl(var(--hue) 100% 85%)" stroke-width="1.6" filter="url(#glow)"/>
          <circle cx="210" cy="462" r="31" fill="none" stroke="var(--c)" stroke-width="1" opacity=".8"/>
        </g>
      </svg>
    </div>
  </section>

  <aside id="log">
    <div class="log-title">EVENT LOG</div>
    <div id="loglist"></div>
  </aside>

  <div id="spec"><canvas id="fft"></canvas></div>
</main>

<audio id="player" loop preload="auto"></audio>

<script>
const $ = s => document.querySelector(s);
const CMDS = [
  [1,"play some music"],[2,"stop the music"],[3,"make a picture"],
  [4,"tell me a joke"],[5,"change the mood"],[6,"show me the weather"],
  [7,"start the demo"],[8,"shut it down"],[9,"ask the model"]
];
const MOODS = [185, 282, 42, 320];

let state = { log: [], tracks: [], mood: 0 };
let player = $("#player");
let actx, analyser, bins, freqData;

/* ---------- command buttons ---------- */
const cmdsEl = $("#cmds");
for (const [id, label] of CMDS) {
  const b = document.createElement("div");
  b.className = "cmd"; b.dataset.id = id;
  b.innerHTML = `<kbd>${id}</kbd><span>${label}</span>`;
  b.onclick = () => sendCmd(id);
  cmdsEl.appendChild(b);
}
addEventListener("keydown", e => {
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 9) sendCmd(n);
});
function sendCmd(id) {
  fetch("/api/cmd/" + id).catch(() => {});
}

/* ---------- audio graph ---------- */
function initAudio() {
  if (actx) { actx.resume(); return; }
  actx = new (window.AudioContext || window.webkitAudioContext)();
  const src = actx.createMediaElementSource(player);
  analyser = actx.createAnalyser();
  analyser.fftSize = 512;
  analyser.smoothingTimeConstant = 0.82;
  src.connect(analyser);
  analyser.connect(actx.destination);
  freqData = new Uint8Array(analyser.frequencyBinCount);
  requestAnimationFrame(tick);
}

let bass = 0, mid = 0;
function tick() {
  requestAnimationFrame(tick);
  if (!analyser) return;
  analyser.getByteFrequencyData(freqData);
  const n = freqData.length;
  let b = 0, m = 0;
  const bEnd = Math.floor(n * 0.10), mEnd = Math.floor(n * 0.42);
  for (let i = 0; i < bEnd; i++) b += freqData[i];
  for (let i = bEnd; i < mEnd; i++) m += freqData[i];
  b /= (bEnd * 255) || 1; m /= ((mEnd - bEnd) * 255) || 1;
  bass = bass * 0.75 + b * 0.25;
  mid  = mid  * 0.75 + m * 0.25;
  document.documentElement.style.setProperty("--bass", bass.toFixed(3));
  document.documentElement.style.setProperty("--mid", mid.toFixed(3));
  drawSpectrum();
}

/* ---------- spectrum ---------- */
const cv = $("#fft"), cx = cv.getContext("2d");
function drawSpectrum() {
  const w = cv.width = cv.clientWidth * devicePixelRatio;
  const h = cv.height = cv.clientHeight * devicePixelRatio;
  cx.clearRect(0, 0, w, h);
  const bars = 96, gap = 2 * devicePixelRatio;
  const bw = w / bars;
  const hue = MOODS[state.mood % MOODS.length];
  for (let i = 0; i < bars; i++) {
    const idx = Math.floor(Math.pow(i / bars, 1.5) * freqData.length);
    const v = (freqData[idx] || 0) / 255;
    const bh = Math.max(2 * devicePixelRatio, v * h * 0.95);
    cx.fillStyle = `hsla(${hue}, 100%, ${52 + v * 28}%, ${0.25 + v * 0.75})`;
    cx.fillRect(i * bw + gap / 2, h - bh, bw - gap, bh);
  }
  cx.fillStyle = `hsla(${hue},100%,60%,.10)`;
  cx.fillRect(0, h - 1, w, 1);
}

/* ---------- SSE ---------- */
function connect() {
  const es = new EventSource("/api/events");
  let last = 0;
  es.onmessage = ev => {
    state = JSON.parse(ev.data);
    last = Date.now();
    render();
  };
  setInterval(() => {
    const on = Date.now() - last < 6000;
    $("#link").classList.toggle("on", on);
    $("#linktext").textContent = on ? "LINKED" : "NO LINK";
  }, 1000);
}

function render() {
  window.state = state;          // handy for debugging from the console
  $("#status").textContent = state.status || "STANDBY";
  $("#heard").textContent = state.heard ? `"${state.heard}"` : "\u00a0";
  $("#pcip").textContent = state.pc || "";
  document.documentElement.style.setProperty("--hue", MOODS[state.mood % MOODS.length]);
  document.body.classList.toggle("playing", !!state.play);

  document.querySelectorAll(".cmd").forEach(el => {
    el.classList.toggle("active", Number(el.dataset.id) === state.cmd && !!state.play);
  });

  const list = $("#loglist");
  list.innerHTML = "";
  [...(state.log || [])].reverse().slice(0, 22).forEach(e => {
    const d = document.createElement("div");
    d.className = "le " + (e.kind || "info");
    d.innerHTML = `<span class="t">${e.t}</span><span>${escapeHtml(e.text)}</span>`;
    list.appendChild(d);
  });

  syncAudio();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

/* ---------- music ---------- */
let fadeTimer = null;
function syncAudio() {
  const want = state.play && state.track;
  if (want) {
    const url = "/assets/music/" + encodeURIComponent(state.track);
    if (player.dataset.track !== url) {
      player.dataset.track = url;
      player.src = url;
      player.volume = 0.85;
    }
    clearInterval(fadeTimer); fadeTimer = null;
    if (player.paused) player.play().catch(err => console.warn("play blocked:", err));
  } else if (!player.paused) {
    if (fadeTimer) return;
    fadeTimer = setInterval(() => {
      player.volume = Math.max(0, player.volume - 0.08);
      if (player.volume <= 0.01) {
        clearInterval(fadeTimer); fadeTimer = null;
        player.pause();
        player.volume = 0.85;
      }
    }, 40);
  }
}

/* ---------- clock + scan ---------- */
setInterval(() => {
  const d = new Date();
  $("#clock").textContent = d.toTimeString().slice(0, 8);
}, 500);

const scan = $("#scan");
let scanY = 90;
setInterval(() => {
  scanY += 4; if (scanY > 320) scanY = 90;
  scan.setAttribute("y", scanY);
}, 60);

/* ---------- boot ---------- */
$("#engage").onclick = () => {
  initAudio();
  $("#boot").classList.add("gone");
  // The autoplay policy blocks play() before a gesture, so ask again now that
  // we have one (the state may already say "playing").
  setTimeout(syncAudio, 120);
};
connect();
render();
</script>
</body>
</html>
