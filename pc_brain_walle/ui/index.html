<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WALL-E // Interactive Vector Unit</title>
    <script src="/vendor/tailwind.js"></script>
    <link href="/vendor/wallefonts.css" rel="stylesheet">
    <link href="/vendor/fonts.css" rel="stylesheet">
    <style>
        :root {
            --bg-cream: #FAF8F3;
            --dot-grey: #DCDAD3;
            --walle-yellow: #F8AE1A;
            --walle-amber: #E08C12;
            --steel-grey: #979AA8;
            --slate-grey: #6E717E;
            --dark-slate: #262930;
            --tread-grey: #525661;
            --outline-ink: #14161A;
            --navy-iris: #183A63;
            --solar-cream: #FFF2B2;
            --alert-red: #D92B2B;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-color: var(--bg-cream);
            font-family: 'Fredoka', 'Nunito', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Signature polka-dot studio canvas matching reference image */
        .polka-canvas {
            position: fixed;
            inset: 0;
            background-color: var(--bg-cream);
            background-image: 
                radial-gradient(circle at 50% 45%, rgba(255, 250, 238, 0.2) 0%, rgba(232, 226, 213, 0.55) 100%),
                radial-gradient(var(--dot-grey) 5.5px, transparent 6px),
                radial-gradient(var(--dot-grey) 5.5px, transparent 6px);
            background-size: 100% 100%, 48px 48px, 48px 48px;
            background-position: 0 0, 0 0, 24px 24px;
            z-index: 0;
        }

        /* Main Stage */
        .stage {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-bottom: 54px;
        }

        .walle-wrapper {
            position: relative;
            width: min(92vw, 660px);
            height: min(82vh, 640px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            filter: drop-shadow(0 18px 24px rgba(20, 22, 26, 0.12));
        }

        svg#walleSvg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* Crisp Dark Cartoon-Vector Strokes */
        .ink-stroke {
            stroke: var(--outline-ink);
            stroke-width: 3.6;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .ink-stroke-thin {
            stroke: var(--outline-ink);
            stroke-width: 2.4;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .ink-stroke-heavy {
            stroke: var(--outline-ink);
            stroke-width: 4.4;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Solar Bar Glow State */
        .solar-bar {
            transition: fill 0.25s ease, filter 0.25s ease, opacity 0.25s ease;
        }

        .solar-bar.charged {
            fill: #FFF4B8;
            filter: drop-shadow(0 0 6px rgba(255, 222, 89, 0.95));
        }

        .solar-bar.uncharged {
            fill: #373B44;
        }

        /* Red Power Button Pulse */
        @keyframes redLedPulse {
            0%, 100% { fill: #D92B2B; filter: drop-shadow(0 0 2px rgba(217, 43, 43, 0.6)); }
            50% { fill: #FF4747; filter: drop-shadow(0 0 7px rgba(255, 71, 71, 0.95)); }
        }

        .red-power-led {
            animation: redLedPulse 2.4s ease-in-out infinite;
        }

        /* Floating Speech Chirp Bubble */
        .chirp-bubble {
            position: absolute;
            top: 8%;
            right: 16%;
            background: #FFFFFF;
            border: 3.2px solid var(--outline-ink);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 16px;
            font-weight: 700;
            color: var(--outline-ink);
            letter-spacing: 0.03em;
            box-shadow: 0 6px 0 var(--outline-ink);
            opacity: 0;
            transform: translateY(10px) scale(0.85);
            pointer-events: none;
            transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 25;
        }

        .chirp-bubble.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .chirp-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 20px;
            width: 14px;
            height: 14px;
            background: #FFFFFF;
            border-right: 3.2px solid var(--outline-ink);
            border-bottom: 3.2px solid var(--outline-ink);
            transform: rotate(45deg);
        }

        /* Minimal Floating Pill Bar at Bottom */
        .control-pill-bar {
            position: fixed;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.92);
            border: 3px solid var(--outline-ink);
            border-radius: 999px;
            box-shadow: 0 6px 0 var(--outline-ink), 0 12px 24px rgba(20, 22, 26, 0.14);
            backdrop-filter: blur(8px);
        }

        .action-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px;
            border-radius: 999px;
            border: 2.5px solid var(--outline-ink);
            background: #FAF8F3;
            color: var(--outline-ink);
            font-family: 'Fredoka', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.14s ease, background-color 0.2s ease, box-shadow 0.14s ease;
            box-shadow: 0 3px 0 var(--outline-ink);
            white-space: nowrap;
        }

        .action-pill:hover {
            background: #FFF3D1;
            transform: translateY(-1px);
        }

        .action-pill:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 var(--outline-ink);
        }

        .action-pill.active-solar {
            background: var(--walle-yellow);
            color: var(--outline-ink);
        }

        .action-pill.active-drive {
            background: var(--steel-grey);
            color: #FFFFFF;
        }

        .action-pill.active-wave {
            background: #FFE08A;
            color: var(--outline-ink);
        }

        .pill-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid var(--outline-ink);
            flex-shrink: 0;
        }

        @media (max-width: 540px) {
            .control-pill-bar {
                gap: 6px;
                padding: 6px 8px;
                bottom: 14px;
            }
            .action-pill {
                padding: 8px 12px;
                font-size: 12.5px;
                gap: 6px;
            }
        }
    </style>
</head>

                                <!-- Glossy Jet-Black Pupil -->
                                <circle cx="418" cy="118" r="23" fill="#0B0D11" />
                                <!-- Crisp White Specular Catchlights -->
                                <circle cx="409" cy="107" r="5.8" fill="#FFFFFF" />
                                <circle cx="428" cy="127" r="2.8" fill="#FFFFFF" opacity="0.9" />
                            </g>

                            <!-- Blinking Eyelid Shutter -->
                            <rect id="rightEyelid" x="370" y="45" width="105" height="0" fill="#F8AE1A" stroke="#14161A" stroke-width="3.5" />
                        </g>
                    </g>

                </g>
            </svg>
        </div>
    </main>

    <!-- Minimal Floating Pill Bar at Bottom -->
    <nav class="control-pill-bar" aria-label="WALL-E Actions">
        <button id="solarBtn" class="action-pill" title="Run Sequential Solar Charge">
            <span class="pill-dot" style="background: #F8AE1A;"></span>
            <span>Solar Charge</span>
        </button>
        <button id="driveBtn" class="action-pill" title="Toggle Caterpillar Tread Drive">
            <span class="pill-dot" style="background: #979AA8;"></span>
            <span>Drive Forward</span>
        </button>
        <button id="waveBtn" class="action-pill" title="Make WALL-E Wave Hello">
            <span class="pill-dot" style="background: #D92B2B;"></span>
            <span>Wave Hello</span>
        </button>
    </nav>

    <script>
        /**
         * WALL-E Interactive Character Controller
         * Handles spring-physics head tracking, expressive blinking, Web Audio API
         * synthesized robotic chirps, sequential solar charging, caterpillar tread drive,
         * and playful claw waving.
         */
        (function () {
            // DOM Elements
            const walleStage = document.getElementById('walleStage');
            const headGroup = document.getElementById('headGroup');
            const chassisGroup = document.getElementById('chassisGroup');
            const leftTreadGroup = document.getElementById('leftTreadGroup');
            const rightTreadGroup = document.getElementById('rightTreadGroup');
            const leftPupilGroup = document.getElementById('leftPupilGroup');
            const rightPupilGroup = document.getElementById('rightPupilGroup');
            const leftEyelid = document.getElementById('leftEyelid');
            const rightEyelid = document.getElementById('rightEyelid');
            const leftArmGroup = document.getElementById('leftArmGroup');
            const leftClawHand = document.getElementById('leftClawHand');
            const chirpBubble = document.getElementById('chirpBubble');

            // Wheels & Tread Links
            const leftWheelLarge = document.getElementById('leftWheelLarge');
            const leftWheelSmall = document.getElementById('leftWheelSmall');
            const leftWheelTop = document.getElementById('leftWheelTop');
            const rightWheel1 = document.getElementById('rightWheel1');
            const leftTreadLinks = document.getElementById('leftTreadLinks');
            const rightTreadLinks = document.getElementById('rightTreadLinks');

            // Solar Bars
            const solarBars = [
                document.getElementById('solarBar1'),
                document.getElementById('solarBar2'),
                document.getElementById('solarBar3'),
                document.getElementById('solarBar4'),
                document.getElementById('solarBar5')
            ];

            // Action Buttons
            const solarBtn = document.getElementById('solarBtn');
            const driveBtn = document.getElementById('driveBtn');
            const waveBtn = document.getElementById('waveBtn');

            // Interactive Physics & Animation State
            const state = {
                mouseX: 0,
                mouseY: 0,
                pupilX: 0,
                pupilY: 0,
                headAngle: 0,
                headVelocity: 0,
                targetHeadAngle: 0,
                headNodY: 0,
                blinkProgress: 0,
                isBlinking: false,
                isDriving: false,
                drivePhase: 0,
                wheelAngle: 0,
                isWaving: false,
                waveProgress: 0,
                isCharging: false,
                happySquint: false,
                chirpTimeout: null,
                audioCtx: null
            };

            const chirps = ['WALL-E!', 'Evaaa?', 'Ta-da!', 'Beep-boop!', 'Weeee!'];

            /**
             * Synthesizes a cute robotic WALL-E chirp using Web Audio API (no external audio files)
             */
            function playWallEChirp(type = 'happy') {
                try {
                    if (!state.audioCtx) {
                        const AudioContext = window.AudioContext || window.webkitAudioContext;
                        state.audioCtx = new AudioContext();
                    }
                    if (state.audioCtx.state === 'suspended') {
                        state.audioCtx.resume();
                    }

                    const ctx = state.audioCtx;
                    const now = ctx.currentTime;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = 'triangle';

                    if (type === 'charge') {
                        osc.frequency.setValueAtTime(340, now);
                        osc.frequency.exponentialRampToValueAtTime(680, now + 0.14);
                        gain.gain.setValueAtTime(0.08, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
                        osc.start(now);
                        osc.stop(now + 0.17);
                    } else if (type === 'wave') {
                        osc.frequency.setValueAtTime(420, now);
                        osc.frequency.exponentialRampToValueAtTime(620, now + 0.12);
                        osc.frequency.exponentialRampToValueAtTime(510, now + 0.24);
                        osc.frequency.exponentialRampToValueAtTime(760, now + 0.38);
                        gain.gain.setValueAtTime(0.1, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                        osc.start(now);
                        osc.stop(now + 0.42);
                    } else {
                        // Signature two-syllable "WALL-E!" pitch inflection
                        osc.frequency.setValueAtTime(310, now);
                        osc.frequency.exponentialRampToValueAtTime(460, now + 0.14);
                        osc.frequency.setValueAtTime(390, now + 0.16);
                        osc.frequency.exponentialRampToValueAtTime(640, now + 0.34);

                        gain.gain.setValueAtTime(0.001, now);
                        gain.gain.linearRampToValueAtTime(0.11, now + 0.03);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);

                        osc.start(now);
                        osc.stop(now + 0.38);
                    }

                    osc.connect(gain);
                    gain.connect(ctx.destination);
                } catch (e) {
                    // Fail silently if browser blocks audio
                }
            }

            /**
             * Displays the speech bubble briefly
             */
            function showChirp(text) {
                chirpBubble.textContent = text || chirps[Math.floor(Math.random() * chirps.length)];
                chirpBubble.classList.add('visible');
                clearTimeout(state.chirpTimeout);
                state.chirpTimeout = setTimeout(() => {
                    chirpBubble.classList.remove('visible');
                }, 1350);
            }

            /**
             * Triggers an eye blink
             */
            function triggerBlink() {
                if (state.isBlinking) return;
                state.isBlinking = true;
                let start = null;
                const duration = 210;

                function step(ts) {
                    if (!start) start = ts;
                    const elapsed = ts - start;
                    const t = Math.min(elapsed / duration, 1);
                    // Smooth close and reopen curve
                    const lidAmount = Math.sin(t * Math.PI);
                    leftEyelid.setAttribute('height', (lidAmount * 125).toFixed(1));
                    rightEyelid.setAttribute('height', (lidAmount * 125).toFixed(1));

                    if (t < 1) {
                        requestAnimationFrame(step);
                    } else {
                        leftEyelid.setAttribute('height', '0');
                        rightEyelid.setAttribute('height', '0');
                        state.isBlinking = false;
                    }
                }
                requestAnimationFrame(step);
            }

            // Periodic natural idle blinking
            setInterval(() => {
                if (!state.isBlinking && !state.happySquint && Math.random() > 0.3) {
                    triggerBlink();
                }
            }, 3400);

            /**
             * Pointer Tracking for Eyes & Head Tilt
             */
            function updatePointer(clientX, clientY) {
                const rect = walleStage.getBoundingClientRect();
                const centerX = rect.left + rect.width * 0.5;
                const centerY = rect.top + rect.height * 0.28;

                const dx = (clientX - centerX) / (window.innerWidth * 0.45);
                const dy = (clientY - centerY) / (window.innerHeight * 0.45);

                state.mouseX = Math.max(-1, Math.min(1, dx));
                state.mouseY = Math.max(-1, Math.min(1, dy));
            }

            window.addEventListener('mousemove', (e) => updatePointer(e.clientX, e.clientY));
            window.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) {
                    updatePointer(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: true });

            /**
             * Clicking directly on WALL-E triggers blink + curious head-tilt + chirp
             */
            walleStage.addEventListener('click', () => {
                triggerBlink();
                playWallEChirp('happy');
                showChirp();
                // Give spring velocity impulse for an expressive curious head tilt
                state.headVelocity += (state.headAngle >= 0 ? -1.8 : 1.8);
            });

            /**
             * 1. Solar Charge Sequence
             */
            solarBtn.addEventListener('click', () => {
                if (state.isCharging) return;
                state.isCharging = true;
                solarBtn.classList.add('active-solar');

                // Empty all 5 solar bars first
                solarBars.forEach((bar) => {
                    bar.classList.remove('charged');
                    bar.classList.add('uncharged');
                });

                showChirp('Solar Charging...');

                // Sequentially illuminate bars 1 -> 5
                solarBars.forEach((bar, index) => {
                    setTimeout(() => {
                        bar.classList.remove('uncharged');
                        bar.classList.add('charged');
                        playWallEChirp('charge');

                        // When full, do a happy eye squint & head wiggle
                        if (index === solarBars.length - 1) {
                            state.happySquint = true;
                            leftEyelid.setAttribute('height', '48');
                            rightEyelid.setAttribute('height', '48');
                            state.headVelocity = 2.2;
                            showChirp('100% Charged!');

                            setTimeout(() => {
                                state.happySquint = false;
                                leftEyelid.setAttribute('height', '0');
                                rightEyelid.setAttribute('height', '0');
                                state.isCharging = false;
                                solarBtn.classList.remove('active-solar');
                            }, 950);
                        }
                    }, (index + 1) * 280);
                });
            });

            /**
             * 2. Drive Forward Toggle (Caterpillar Treads + Bogie Wheels + Rumble)
             */
            driveBtn.addEventListener('click', () => {
                state.isDriving = !state.isDriving;
                driveBtn.classList.toggle('active-drive', state.isDriving);
                if (state.isDriving) {
                    playWallEChirp('happy');
                    showChirp('Rolling out!');
                }
            });

            /**
             * 3. Wave Hello Gesture
             */
            waveBtn.addEventListener('click', () => {
                if (state.isWaving) return;
                state.isWaving = true;
                state.waveProgress = 0;
                waveBtn.classList.add('active-wave');
                triggerBlink();
                playWallEChirp('wave');
                showChirp('Hello!');
                state.headVelocity = -1.5;
            });

            /**
             * Main 60FPS Spring Physics & Mechanical Animation Loop
             */
            function animate() {
                // 1. Smoothly interpolate pupils inside the binocular sockets
                const targetPupilX = state.mouseX * 11;
                const targetPupilY = state.mouseY * 9;
                state.pupilX += (targetPupilX - state.pupilX) * 0.14;
                state.pupilY += (targetPupilY - state.pupilY) * 0.14;

                leftPupilGroup.setAttribute('transform', `translate(${state.pupilX.toFixed(2)}, ${state.pupilY.toFixed(2)})`);
                rightPupilGroup.setAttribute('transform', `translate(${state.pupilX.toFixed(2)}, ${state.pupilY.toFixed(2)})`);

                // 2. Spring physics for expressive binocular head tilt
                state.targetHeadAngle = state.mouseX * 8.5;
                const springK = 0.08;
                const damping = 0.82;
                const force = (state.targetHeadAngle - state.headAngle) * springK;
                state.headVelocity = (state.headVelocity + force) * damping;
                state.headAngle += state.headVelocity;

                const nodOffset = state.mouseY * 4.5 + (state.isDriving ? Math.sin(state.drivePhase * 2) * 2.2 : 0);
                headGroup.setAttribute(
                    'transform',
                    `translate(0, ${nodOffset.toFixed(2)}) rotate(${state.headAngle.toFixed(2)}, 350, 165)`
                );

                // 3. Caterpillar Tread Drive Animation
                if (state.isDriving) {
                    state.drivePhase += 0.24;
                    state.wheelAngle = (state.wheelAngle + 4.8) % 360;

                    // Rotate bogie wheels
                    leftWheelLarge.setAttribute('transform', `translate(178, 526) rotate(${state.wheelAngle.toFixed(1)})`);
                    leftWheelSmall.setAttribute('transform', `translate(248, 566) rotate(${(state.wheelAngle * 1.6).toFixed(1)})`);
                    leftWheelTop.setAttribute('transform', `translate(196, 444) rotate(${(state.wheelAngle * 1.9).toFixed(1)})`);
                    rightWheel1.setAttribute('transform', `translate(486, 512) rotate(${state.wheelAngle.toFixed(1)})`);

                    // Oscillate tread grouser links to create continuous belt motion illusion
                    const linkShift = (state.drivePhase * 3.5) % 18;
                    leftTreadLinks.setAttribute('transform', `translate(${(linkShift * 0.52).toFixed(2)}, ${(linkShift * 0.85).toFixed(2)})`);
                    rightTreadLinks.setAttribute('transform', `translate(${(linkShift * 0.35).toFixed(2)}, ${(linkShift * 0.75).toFixed(2)})`);

                    // Subtle mechanical chassis rumble
                    const bounceY = Math.sin(state.drivePhase * 2.2) * 2.4;
                    const rockAngle = Math.sin(state.drivePhase * 1.1) * 0.75;
                    chassisGroup.setAttribute('transform', `translate(0, ${bounceY.toFixed(2)}) rotate(${rockAngle.toFixed(2)}, 330, 420)`);
                } else {
                    chassisGroup.setAttribute('transform', 'translate(0, 0)');
                }

                // 4. Wave Hello Arm & Claw Articulation
                if (state.isWaving) {
                    state.waveProgress += 0.032;
                    if (state.waveProgress >= 1) {
                        state.isWaving = false;
                        leftArmGroup.setAttribute('transform', 'rotate(0, 295, 375)');
                        leftClawHand.setAttribute('transform', 'rotate(0, 320, 405)');
                        waveBtn.classList.remove('active-wave');
                    } else {
                        // Smooth raise -> 2 playful waves -> lower
                        const envelope = Math.sin(state.waveProgress * Math.PI);
                        const wiggle = Math.sin(state.waveProgress * Math.PI * 5) * 14 * envelope;
                        const armLift = -28 * envelope + wiggle * 0.5;
                        const clawFlick = -18 * envelope + wiggle * 1.3;

                        leftArmGroup.setAttribute('transform', `rotate(${armLift.toFixed(2)}, 295, 375)`);
                        leftClawHand.setAttribute('transform', `rotate(${clawFlick.toFixed(2)}, 320, 405)`);
                    }
                }

                requestAnimationFrame(animate);
            }

            // ---- hook for the HUD overlay (JARVIS-style bridge) ----
            window.__walle = {
                chirp: (t) => { try { playWallEChirp(t); } catch (e) {} },
                say: (t) => { try { showChirp(t); } catch (e) {} },
                blink: () => { try { triggerBlink(); } catch (e) {} },
                wave: () => waveBtn.click(),
                drive: () => driveBtn.click(),
                charge: () => solarBtn.click(),
            };

            window.onload = function () {
                requestAnimationFrame(animate);
            };
        })();
    </script>

    <div id="whud"></div>
    <script src="/walle-overlay.js?v=20261123g"></script>
